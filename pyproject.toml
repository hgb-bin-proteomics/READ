[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "IMP-READ"
version = "2026.9.9"
description = "TMTpro-18plex quantification for [single cell] DIA and DDA searches."
keywords = ["mass spectrometry", "proteomics"]
readme = "docs/PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Micha Johannes Birklbauer", email = "micha.birklbauer@fh-hagenberg.at" },
]
maintainers = [
    { name = "Micha Johannes Birklbauer", email = "micha.birklbauer@fh-hagenberg.at" },
]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Development Status :: 5 - Production/Stable"
]
dependencies = [
    "numpy>=2.3.4",
    "pandas<3",
    "pyarrow>=22.0.0",
    "pyopenms>=3.4.0,<3.5.0",
    "pyteomics[xml]>=4.7.5,<5",
    "tqdm>=4.67.1",
]

[project.scripts]
tmt_chimerys = "imp_read:tmt_chimerys"
tmt_chimerys_dda = "imp_read:tmt_chimerys_dda"
tmt_diann = "imp_read:tmt_diann"
tmt_spectronaut = "imp_read:tmt_spectronaut"

[project.urls]
Homepage = "https://github.com/hgb-bin-proteomics/READ"
Documentation = "https://github.com/hgb-bin-proteomics/READ"
Repository = "https://github.com/hgb-bin-proteomics/READ.git"
Issues = "https://github.com/hgb-bin-proteomics/READ/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
